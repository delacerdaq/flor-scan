<article class="plant-card">
  <a class="plant-cover" [routerLink]="['/plantas', planta.id]" [attr.aria-label]="'Ver detalhes de ' + planta.nome">
    <img [src]="planta.imagem" [alt]="'Ilustração da planta ' + planta.nome" loading="lazy">
    <span class="plant-category">{{ planta.categoria }}</span>
  </a>
  <button class="favorite-button" type="button" [class.selected]="plantas.ehFavorita(planta.id)"
    (click)="favoritar($event)" [attr.aria-label]="plantas.ehFavorita(planta.id) ? 'Remover ' + planta.nome + ' dos favoritos' : 'Favoritar ' + planta.nome"
    [attr.aria-pressed]="plantas.ehFavorita(planta.id)">
    <svg viewBox="0 0 24 24" [attr.fill]="plantas.ehFavorita(planta.id) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
  </button>
  <div class="plant-info">
    <div class="plant-heading"><h3><a [routerLink]="['/plantas', planta.id]">{{ planta.nome }}</a></h3><span class="level" [class.easy]="planta.dificuldade === 'Fácil'">{{ planta.dificuldade }}</span></div>
    <p class="latin">{{ planta.nomeCientifico }}</p>
    <div class="plant-facts"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c2 3 6 6 6 11a6 6 0 0 1-12 0c0-5 4-8 6-11Z"/></svg>{{ planta.rega }}</span></div>
    <a class="text-link card-link" [routerLink]="['/plantas', planta.id]">Ver detalhes <span aria-hidden="true">→</span></a>
  </div>
</article>
